<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Mầm non Bình Minh - DAWN Kindergarten</title>
  <desc id="logoDesc">Logo mặt trời mọc vàng cam cùng tên trường Mầm non Bình Minh / DAWN Kindergarten</desc>

  <!-- Nền tròn cream -->
  <circle cx="160" cy="130" r="86" fill="#FFF6E3"/>
  <circle cx="160" cy="130" r="86" fill="none" stroke="#F6D77A" stroke-width="3"/>

  <!-- Mặt trời mọc -->
  <path d="M 96 150 A 64 64 0 0 1 224 150 Z" fill="#F0B040"/>
  <!-- Tia nắng -->
  <g stroke="#F0B040" stroke-width="5" stroke-linecap="round">
    <line x1="160" y1="30" x2="160" y2="46"/>
    <line x1="96" y1="56" x2="107" y2="70"/>
    <line x1="224" y1="56" x2="213" y2="70"/>
    <line x1="66" y1="104" x2="82" y2="110"/>
    <line x1="254" y1="104" x2="238" y2="110"/>
  </g>

  <!-- Vầng sáng -->
  <circle cx="160" cy="130" r="46" fill="#FBE9B0"/>

  <!-- Chữ -->
  <text x="160" y="252" text-anchor="middle" font-family="'Plus Jakarta Sans','Be Vietnam Pro',sans-serif" font-size="30" font-weight="800" fill="#301030" letter-spacing="1">DAWN</text>
  <text x="160" y="278" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="16" font-weight="700" fill="#301030" letter-spacing="4">KINDERGARTEN</text>
  <text x="160" y="304" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="14" font-weight="600" fill="#6E8F6A" letter-spacing="2">MẦM NON BÌNH MINH</text>
</svg>
